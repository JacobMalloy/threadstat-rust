[workspace]
members = ["threadstat-rust"]
resolver = "3"

[workspace.lints.clippy]
pedantic = "warn"

[workspace.dependencies]
string-intern = {git = "https://github.com/JacobMalloy/string-intern.git"}
clap = { version = "4.5.60", features = ["derive"] }

[profile.release]
lto = "fat"
codegen-units = 1
